<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Paciente</title>

    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
    <h2>Cadastro de Paciente</h2>

    <form id="cadastroForm">
        <p><label for="nome">Nome *</label>
        <input type="text" id="nome" required></p>
        
        <p><label for="cpf">CPF *</label>
        <input type="text" id="cpf" required maxlength="11"></p>
        
        <p><label for="telefone">Telefone *</label>
        <input type="text" id="telefone" required></p>
        
        <p><label for="endereco">Endereço</label>
        <input type="text" id="endereco"></p>
        
        <p><label for="convenio">Convênio</label>
        <input type="text" id="convenio"></p>

        <p>Campos com * devem ser preenchidos obrigatoriamente</p>

            <input class="botao salvarPaciente" type="button" value="Salvar" onclick="salvarPaciente()">
            <input class="botao voltarIndex" type="button" value="Voltar" onclick="voltar()">
            
        </p>

-->
        <div class="btn-group" role="group" aria-label="Basic example">            
            <button onclick="window.location.href='/listar-paciente'" class="btn btn-secondary">Salvar</button>             
            <button onclick="window.location.href='/tela-inicio'" class="btn btn-secondary">Voltar</button> 
        </div>
    </form>
    
</div>

    
</body>

</html>
